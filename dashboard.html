<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#15171b;--mute:#6b6f76;--line:#e5e2db;--sold:#16a34a;--no:#dc2626;--fu:#d97706;--skip:#64748b;--acc:#0f766e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
header{background:#111316;color:#fff;padding:18px 24px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1300px;margin:0 auto}
h1{margin:0;font:800 28px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.4px}h1 span{color:#5eead4}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,button{font:inherit;font-size:13px;border-radius:9px;border:1px solid #3a3d44;background:#22252b;color:#fff;padding:8px 10px}
button{cursor:pointer;font-weight:700}button.lt{background:#fff;color:#111;border-color:#fff}
main{max-width:1300px;margin:0 auto;padding:20px 24px 60px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.k b{display:block;font:800 30px/1 'Barlow Condensed'}.k small{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.card h2{margin:0 0 2px;font:700 20px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.3px}.card .sub{color:var(--mute);font-size:12.5px;margin-bottom:10px}
.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top}tr:hover td{background:#faf9f5}
.pill{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.s-sold{color:var(--sold)}.s-no{color:var(--no)}.s-fu{color:var(--fu)}.s-skip{color:var(--skip)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.photos a{display:block;text-decoration:none;color:inherit}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee;display:block}.photos div{font-size:12px;margin-top:4px}
.empty{color:var(--mute);padding:20px;text-align:center}
.setup{max-width:560px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.setup input{width:100%;background:#fff;color:#111;border:1.5px solid var(--line);margin:6px 0 12px;padding:10px}
.setup button{background:#111;border:0;padding:10px 16px}
.err{background:#fde4e1;color:#b42318;padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none}
/* QR tags */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tag{border:2px solid #111;border-radius:14px;padding:12px;text-align:center;break-inside:avoid;background:#fff}
.tag .b{font:800 22px/1 'Barlow Condensed';letter-spacing:.5px}.tag .b span{color:#0f766e}.tag svg{width:100%;max-width:160px;display:block;margin:8px auto}
.tag .cta{font-weight:800;font-size:13px}.tag .st{font-size:10px;color:#777;margin-top:4px}
@media print{header,.noprint,.kp,.grid>.card:not(.printme){display:none!important}main{padding:0}.card{border:0;padding:0}.tags{grid-template-columns:repeat(3,1fr)}body{background:#fff}}
</style>

const photoUrl=t=>SB_URL+'/storage/v1/object/public/photos/'+String(t).slice(3).split('/').map(encodeURIComponent).join('/');
async function q(p){const {data,error}=await p;if(error)throw new Error(error.message||String(error));return data}
let data=null,sortKey='last',sortDir=-1,showAll=false,tagsOn=location.hash==='#qr';

// directory from the plan
const DIR={};DAYS.forEach(D=>PLAN[D.k].stops.forEach((s,i)=>{const k=storeKeyOf(s.name,s.addr);if(!DIR[k])DIR[k]={storeKey:k,name:s.name,addr:s.addr,phone:s.contact||'',day:D.k,seq:i+1,kind:s.kind}}));

function parseRow(r){const o={...r};['reasons','alsoDone','photos'].forEach(k=>o[k]=Array.isArray(o[k])?o[k]:(o[k]?String(o[k]).split(' | ').filter(Boolean):[]));
  if(!Array.isArray(o.items)){try{o.items=o.items?JSON.parse(o.items):[]}catch(e){o.items=[]}}['cases','freeCans','freeCases'].forEach(k=>o[k]=+o[k]||0);
  ['orderTotal','paid','sampleCost','discount'].forEach(k=>o[k]=parseFloat(o[k])||0);o.deleted=String(o.deleted).toUpperCase()==='TRUE';if(!o.storeKey)o.storeKey=storeKeyOf(o.store,o.address);return o}
async function load(){
  if(!sb){setup('Supabase isn\'t set up yet: add your Project URL and publishable key to config.js.',true);return}
  const {data:{session}}=await sb.auth.getSession();if(!session){setup();return}
  try{
    const [rows,log,cfg,sc]=await Promise.all([q(sb.from('checkins').select('data')),q(sb.from('visits_log').select('data').order('at',{ascending:true}).limit(10000)),
      q(sb.from('app_config').select('key,value')),q(sb.from('qr_scans').select('store_key').limit(20000))]);
    const config={};cfg.forEach(x=>config[x.key]=x.value);const scans={};sc.forEach(x=>scans[x.store_key]=(scans[x.store_key]||0)+1);
    data={rows:rows.map(x=>parseRow(x.data||{})),log:log.map(x=>parseRow(x.data||{})),config,scans};
    (data.rows.concat(data.log)).forEach(r=>{if(r.storeKey&&!DIR[r.storeKey])DIR[r.storeKey]={storeKey:r.storeKey,name:r.store,addr:r.address,phone:r.phone,day:r.day,kind:r.kind}});
    $('#upd').innerHTML='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' · '+esc(session.user.email)+' · <a href="#" id="so" style="color:#5eead4">sign out</a>';
    $('#so').onclick=async e=>{e.preventDefault();await sb.auth.signOut();data=null;setup()};
    const reps=[...new Set(data.log.map(r=>r.by).filter(Boolean))].sort();$('#rep').innerHTML='<option value="">Everyone</option>'+reps.map(r=>`<option ${r===$('#rep').value?'selected':''}>${esc(r)}</option>`).join('');
    render();
  }catch(e){setup('Couldn\'t load: '+e.message)}
}
function setup(err,hard){
  $('#main').innerHTML=`<div class="setup"><div class="err" style="display:${err?'block':'none'}">${esc(err||'')}</div><h2 style="margin-top:0">Sign in to the dashboard</h2>
   <p style="color:var(--mute)">Use the same email and password as the IV-X Field app.</p>
   ${hard?'':`<label>Email<input id="se" type="email" value="${esc(LS.get('lastEmail',''))}"></label><label>Password<input id="sp" type="password"></label><button id="go">Sign in</button>`}</div>`;
  if(hard)return;
  const go=async()=>{try{const {error}=await sb.auth.signInWithPassword({email:$('#se').value.trim(),password:$('#sp').value});if(error)throw error;LS.set('lastEmail',$('#se').value.trim());load()}catch(e){setup(/invalid/i.test(e.message)?'Wrong email or password.':e.message)}};
  $('#go').onclick=go;$('#sp').onkeydown=e=>{if(e.key==='Enter')go()};
}
// latest save per record id
function latestById(log){const m={};log.forEach(e=>{if(e.kind==='payment')return;if(!m[e.id]||String(m[e.id].at)<String(e.at))m[e.id]=e});return Object.values(m).filter(e=>!e.deleted&&e.status)}
function inRange(e,rng){if(rng==='all')return true;const d=ymd(new Date(e.at));if(rng==='today')return d===ymd();if(rng==='week')return d>='2026-11-09'&&d<='2026-11-15'||e.day&&DAYS.some(x=>x.k===e.day)&&d<='2026-11-15';return e.day===rng}
function stageOf(tl){if(!tl.length)return'Prospect';const sold=tl.filter(e=>e.status==='sold').length;if(sold>=3)return'Regular';if(sold===2)return'Reorder';if(sold===1)return'First order';
  if(tl[0].status==='no'&&tl[0].reasons.includes('Not interested'))return'Lost';if(tl.some(e=>e.freeCans||e.freeCases||e.alsoDone.includes('Samples left')))return'Sampled';return'Pitched'}

// ---------- tiny SVG charts ----------
function hbars(rows,{color='#0f766e',fmt=v=>v,max}={}){ // rows: [label, value, color?]
  if(!rows.length)return'<div class="empty">No data yet</div>';
  const W=560,lh=30,lw=170,M=max||Math.max(...rows.map(r=>r[1]),1);
  return`<svg viewBox="0 0 ${W} ${rows.length*lh+6}" width="100%" role="img">${rows.map(([l,v,c],i)=>{const w=Math.max(2,(W-lw-70)*v/M),y=i*lh+4;
    return`<text x="${lw-8}" y="${y+17}" text-anchor="end" font-size="12.5" fill="#333">${esc(String(l).slice(0,26))}</text><rect x="${lw}" y="${y+4}" width="${w}" height="18" rx="4" fill="${c||color}"/><text x="${lw+w+6}" y="${y+17}" font-size="12.5" font-weight="700" fill="#111">${esc(fmt(v))}</text>`}).join('')}</svg>`}
function dayChart(byDay){ // stacked outcome bars per day + close-rate labels
  const W=560,H=230,pl=34,pb=26,pt=22,bw=56,keys=['sold','fu','no','skip'],col={sold:'#16a34a',fu:'#d97706',no:'#dc2626',skip:'#94a3b8'};
  const M=Math.max(...byDay.map(d=>keys.reduce((t,k)=>t+d[k],0)),1);const step=(W-pl)/byDay.length;
  let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  [0,.5,1].forEach(f=>{const y=H-pb-(H-pb-pt)*f;o+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#999">${Math.round(M*f)}</text>`});
  byDay.forEach((d,i)=>{let y=H-pb;const x=pl+i*step+(step-bw)/2;keys.forEach(k=>{const h=(H-pb-pt)*d[k]/M;if(h>0){y-=h;o+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${col[k]}"><title>${SL[k]}: ${d[k]}</title></rect>`}});
    const tot=keys.reduce((t,k)=>t+d[k],0);o+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11.5" font-weight="700">${tot?Math.round(d.sold/tot*100)+'%':''}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="700" fill="${HEX[d.k]}">${d.label}</text>`});
  return o+'</svg><div class="sub" style="margin-top:4px">■ <span class="s-sold">sold</span> ■ <span class="s-fu">follow up</span> ■ <span class="s-no">no sale</span> ■ <span style="color:#94a3b8">closed</span> · % = close rate</div>'}


// ---- money owed & sell-through (mirrors the app's logic)
function owedList(){const rows=data.rows.filter(r=>!r.deleted);const pays=rows.filter(r=>r.kind==='payment');
  return rows.filter(r=>r.status==='sold'&&r.invoiceNo&&(parseFloat(r.orderTotal)||0)>0).map(r=>{const tot=parseFloat(r.orderTotal)||0;
    const paid=(parseFloat(r.paid)||0)+pays.filter(x=>x.invoiceNo===r.invoiceNo).reduce((t,x)=>t+(parseFloat(x.amount)||0),0);return{r,tot,paid,bal:Math.round((tot-paid)*100)/100}}).filter(x=>x.bal>0.004)}
function sellThroughAll(){const prods=(data.config.products||[]);const upc=id=>{const p=prods.find(x=>x.id===id);return p&&+p.unitsPerCase?+p.unitsPerCase:1};
  const by={};latestById(data.log.length?data.log:data.rows).forEach(e=>{(by[e.storeKey]=by[e.storeKey]||[]).push(e)});
  const out=[];Object.entries(by).forEach(([k,ev])=>{ev.sort((a,b)=>String(a.at).localeCompare(String(b.at)));let stock=null,lastAt=null,sold=0,days=0,lastShelf=null;
    ev.forEach(e=>{const t=new Date(e.at).getTime();const sh=e.shelf&&Object.keys(e.shelf).length?e.shelf:null;
      if(sh&&stock){const d=(t-lastAt)/864e5;if(d>0.5){Object.keys(stock).forEach(pid=>sold+=Math.max(0,(stock[pid]||0)-(+sh[pid]||0)));days+=d}}
      const next=sh?Object.fromEntries(Object.entries(sh).map(([a,b])=>[a,+b||0])):{...(stock||{})};(e.items||[]).forEach(i=>next[i.id]=(next[i.id]||0)+(+i.q||0)*upc(i.id));
      if((e.items||[]).length||sh){stock=next;lastAt=t}if(sh)lastShelf={at:e.at,n:Object.values(sh).reduce((a,b)=>a+(+b||0),0)}});
    if(days>=0.5)out.push({k,name:(DIR[k]||{}).name||ev[0].store,perWeek:sold/days*7,days:Math.round(days),lastShelf})});
  return out.sort((a,b)=>b.perWeek-a.perWeek)}
function render(){
  const rng=$('#rng').value,rep=$('#rep').value;
  const all=latestById(data.log.length?data.log:data.rows);
  const ev=all.filter(e=>inRange(e,rng)&&(!rep||e.by===rep));
  const n=s=>ev.filter(e=>e.status===s).length,sum=k=>ev.reduce((t,e)=>t+(+e[k]||0),0);
  const sold=n('sold'),cost=sum('sampleCost'),scanT=Object.values(data.scans).reduce((a,b)=>a+b,0);
  // per store
  const byStore={};all.forEach(e=>{(byStore[e.storeKey]=byStore[e.storeKey]||[]).push(e)});Object.values(byStore).forEach(a=>a.sort((x,y)=>String(y.at).localeCompare(String(x.at))));
  const stores=Object.keys(DIR).map(k=>{const tl=byStore[k]||[];const last=tl[0];const nextFu=last&&last.followUpDate;
    return{...DIR[k],stage:stageOf(tl),visits:tl.length,last:last?last.at:'',lastStatus:last?last.status:'',cases:tl.reduce((t,e)=>t+(e.status==='sold'||e.status==='fu'?e.cases:0),0),orders:tl.reduce((t,e)=>t+e.orderTotal,0),
      due:nextFu||'',scans:data.scans[k]||0,photos:tl.flatMap(e=>e.photos.filter(p=>p.startsWith('sb:'))),contact:(tl.find(e=>e.contactName)||{}).contactName||'',by:last?last.by:''}});
  const pipe={};STAGES.forEach(s=>pipe[s]=0);stores.forEach(s=>pipe[s.stage]++);
  const flav={};ev.forEach(e=>e.items.forEach(i=>flav[i.n]=(flav[i.n]||0)+i.q));
  const reasons={};ev.forEach(e=>e.reasons.forEach(r=>reasons[r]=(reasons[r]||0)+1));
  const reps={};ev.forEach(e=>{const k=e.by||'Unnamed';const r=reps[k]=reps[k]||{v:0,s:0,c:0,o:0,p:0,f:0};r.v++;if(e.status==='sold')r.s++;r.c+=e.cases;r.o+=e.orderTotal;r.p+=e.paid;r.f+=e.sampleCost});
  const byDay=DAYS.map(D=>{const x={k:D.k,label:D.d,sold:0,fu:0,no:0,skip:0};all.filter(e=>e.day===D.k&&(!rep||e.by===rep)).forEach(e=>x[e.status]++);return x});
  const today=ymd(),due=stores.filter(s=>s.due&&s.due<=today);
  let o=`<div class="kp">${[[ev.length,'Stores visited'],[sold,'Sold'],[ev.length?Math.round(sold/ev.length*100)+'%':'—','Close rate'],[sum('cases'),'Cases'],[money(sum('orderTotal')),'Order value'],[money(sum('paid')),'Collected'],
    [money(cost),'Samples & freebies'],[sold&&cost?money(cost/sold):'—','Cost per sale'],[scanT,'QR scans'],[due.length,'Follow-ups due']].map(([b,s])=>`<div class="k"><b>${b}</b><small>${s}</small></div>`).join('')}</div>
  <div class="grid">
   <div class="card"><h2>Outcomes by route day</h2><div class="sub">Every check-in on the five route days</div>${dayChart(byDay)}</div>
   <div class="card"><h2>Pipeline</h2><div class="sub">Every store on the routes and walk-ins, by stage</div>${hbars(STAGES.map(s=>[s,pipe[s],STAGE_COL[s]]))}</div>
   <div class="card"><h2>Flavors sold</h2><div class="sub">Cases ordered through the order form</div>${hbars(Object.entries(flav).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v]),{fmt:v=>v+' cs'})}</div>
   <div class="card"><h2>Top objections</h2><div class="sub">Reasons tapped on no-sale / follow-up visits</div>${hbars(Object.entries(reasons).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,v,'#dc2626']))}</div>
   <div class="card full"><h2>Money owed</h2><div class="sub">Open invoices from sales on Net 15 / Net 30 / Consignment / Pay next visit</div>${(()=>{const L=owedList(),t=ymd();const tot=L.reduce((s,x)=>s+x.bal,0),od=L.filter(x=>x.r.dueDate&&x.r.dueDate<t);
     return L.length?`<p style="margin:0 0 8px"><b style="font-size:18px">${money(tot)}</b> outstanding · <b style="color:${od.length?'var(--no)':'inherit'}">${od.length} overdue</b></p><table><tr><th>Store</th><th>Invoice</th><th>Terms</th><th>Total</th><th>Paid</th><th>Owes</th><th>Due</th></tr>${L.sort((a,b)=>String(a.r.dueDate||'9').localeCompare(String(b.r.dueDate||'9'))).map(x=>`<tr><td><b>${esc(x.r.store)}</b></td><td>${esc(x.r.invoiceNo)}</td><td>${esc({net15:'Net 15',net30:'Net 30',consign:'Consignment',next:'Next visit',paid:'Paid'}[x.r.terms]||'')}</td><td>${money(x.tot)}</td><td>${money(x.paid)}</td><td><b>${money(x.bal)}</b></td><td style="${x.r.dueDate&&x.r.dueDate<t?'color:var(--no);font-weight:700':''}">${x.r.dueDate||'—'}</td></tr>`).join('')}</table>`:'<div class="empty">Nothing owed right now</div>'})()}</div>
   <div class="card full"><h2>Sell-through</h2><div class="sub">From shelf counts on revisits: how fast IV-X is actually selling in each store</div>${(()=>{const L=sellThroughAll();return L.length?`<table><tr><th>Store</th><th>Cans / week</th><th>Measured over</th><th>Last shelf count</th></tr>${L.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td><b>${Math.round(x.perWeek)}</b></td><td>${x.days} days</td><td>${x.lastShelf?x.lastShelf.n+' cans · '+new Date(x.lastShelf.at).toLocaleDateString([],{month:'short',day:'numeric'}):'—'}</td></tr>`).join('')}</table>`:'<div class="empty">Shows up once a store has been counted on a revisit</div>'})()}</div>
   <div class="card full"><h2>By person</h2><table><tr><th>Person</th><th>Visits</th><th>Sold</th><th>Close rate</th><th>Cases</th><th>Orders</th><th>Collected</th><th>Samples</th></tr>
    ${Object.entries(reps).sort((a,b)=>b[1].c-a[1].c).map(([k,r])=>`<tr><td><b>${esc(k)}</b></td><td>${r.v}</td><td>${r.s}</td><td>${r.v?Math.round(r.s/r.v*100):0}%</td><td>${r.c}</td><td>${money(r.o)}</td><td>${money(r.p)}</td><td>${money(r.f)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No check-ins yet</td></tr>'}</table></div>
   <div class="card full"><h2>Stores</h2><div class="sub"><input id="q" placeholder="Search stores…" style="background:#fff;color:#111;border:1px solid var(--line);width:260px"> · click a column to sort</div><div style="overflow-x:auto"><table id="stab"></table></div><div id="more"></div></div>
   <div class="card full"><h2>Shelf photos</h2><div class="sub">Newest first — click to open full size</div><div class="photos">${ev.flatMap(e=>e.photos.concat(e.signature?[]:[]).filter(p=>p.startsWith('sb:')).map(p=>({p,e}))).sort((a,b)=>String(b.e.at).localeCompare(String(a.e.at))).slice(0,48).map(({p,e})=>`<a href="${photoUrl(p)}" target="_blank"><img loading="lazy" src="${photoUrl(p)}"><div><b>${esc(e.store)}</b><br>${new Date(e.at).toLocaleDateString([],{month:'short',day:'numeric'})}${e.by?' · '+esc(e.by):''}</div></a>`).join('')||'<div class="empty">No photos yet</div>'}</div></div>
   <div class="card full printme" id="qr"><h2>QR shelf tags</h2><div class="sub noprint">Each tag counts scans for its store and sends shoppers to: <b>${esc((data.config.settings||{}).qrUrl||'— set the link in the app: Settings → QR shelf tags')}</b>. Print on sticker paper or cardstock (Ctrl/Cmd+P).
    <br><select id="qd" style="background:#fff;color:#111;border:1px solid var(--line);margin-top:8px"><option value="">All stores</option>${DAYS.map(d=>`<option value="${d.k}">${d.d} route</option>`).join('')}<option value="sold">Only stores that bought</option></select> <button id="tg" style="background:#0f766e">Show tags</button> <button id="pr" style="background:#111">Print tags</button></div><div class="tags" id="tags"></div></div>
  </div>`;
  $('#main').innerHTML=o;
  drawStores(stores);$('#q').oninput=()=>drawStores(stores);
  const tg=()=>{$('#tg').textContent=tagsOn?'Hide tags':'Show tags';if(tagsOn)drawTags(stores);else $('#tags').innerHTML=''};tg();
  $('#tg').onclick=()=>{tagsOn=!tagsOn;tg()};$('#qd').onchange=()=>{tagsOn=true;tg()};$('#pr').onclick=()=>{if(!tagsOn){tagsOn=true;tg()}setTimeout(()=>window.print(),300)};
  $('#csv').onclick=()=>{const cols=['name','addr','phone','day','stage','visits','lastStatus','last','cases','orders','due','scans','contact','by'];
    const csv=[cols.join(',')].concat(stores.map(s=>cols.map(c=>'"'+String(s[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ivx-stores-'+ymd()+'.csv';a.click()};
  if(location.hash==='#qr')setTimeout(()=>$('#qr').scrollIntoView(),50);
}
function drawStores(stores){
  const q=($('#q').value||'').toLowerCase();
  const cols=[['name','Store'],['day','Route'],['stage','Stage'],['visits','Visits'],['lastStatus','Last outcome'],['last','Last visit'],['cases','Cases'],['orders','Orders'],['due','Follow-up'],['scans','Scans'],['contact','Contact']];
  const all=stores.filter(s=>!q||(s.name+' '+s.addr).toLowerCase().includes(q)).sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return(x>y?1:x<y?-1:0)*sortDir});const rows=showAll||q?all:all.slice(0,20);
  $('#stab').innerHTML=`<tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`+rows.map(s=>`<tr><td><b>${esc(s.name)}</b><div style="color:var(--mute);font-size:12px">${esc(s.addr||'')}${s.phone?' · '+esc(s.phone):''}</div></td>
   <td style="color:${HEX[s.day]||'#555'};font-weight:700">${esc((DAYS.find(d=>d.k===s.day)||{d:s.day==='due'?'F/U':s.day==='gym'?'Gym':'—'}).d)}</td><td><span class="pill" style="background:${STAGE_COL[s.stage]}1f;color:${STAGE_COL[s.stage]}">${s.stage}</span></td>
   <td>${s.visits}</td><td class="s-${s.lastStatus}">${SL[s.lastStatus]||'—'}</td><td>${s.last?new Date(s.last).toLocaleDateString([],{month:'short',day:'numeric'}):'—'}</td><td>${s.cases||'—'}</td><td>${s.orders?money(s.orders):'—'}</td>
   <td style="${s.due&&s.due<=ymd()?'color:var(--no);font-weight:700':''}">${s.due||'—'}</td><td>${s.scans||'—'}</td><td>${esc(s.contact)}</td></tr>`).join('');
  $('#more').innerHTML=all.length>20&&!q?`<button class="lt" style="margin-top:10px">${showAll?'Show top 20':'Show all '+all.length+' stores'}</button>`:'';const mb=$('#more button');if(mb)mb.onclick=()=>{showAll=!showAll;drawStores(stores)};
  $('#stab').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortDir=sortKey===k?-sortDir:-1;sortKey=k;drawStores(stores)});
}
function qrSVG(text){const g=makeQR(text,'M'),n=g.length,q=4;let p='';g.forEach((row,r)=>row.forEach((d,c)=>{if(d)p+=`M${c+q},${r+q}h1v1h-1z`}));
  return`<svg viewBox="0 0 ${n+2*q} ${n+2*q}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`}
function drawTags(stores){
  const f=$('#qd').value,target=(data.config.settings||{}).qrUrl||'';const base=location.origin+location.pathname.replace(/[^/]*$/,'')+'q.html';
  const list=stores.filter(s=>!f||(f==='sold'?['First order','Reorder','Regular'].includes(s.stage):s.day===f));
  $('#tags').innerHTML=list.map(s=>{const u=base+'?s='+encodeURIComponent(s.storeKey);
    return`<div class="tag"><div class="b">IV-X <span>●</span></div>${qrSVG(u)}<div class="cta">Scan for IV-X on TikTok</div><div class="st">${esc(s.name)}</div></div>`}).join('')||'<div class="empty">No stores match</div>';
}
$('#rng').onchange=()=>data&&render();$('#rep').onchange=()=>data&&render();$('#rf').onclick=load;
load();setInterval(()=>{if(!document.hidden)load()},120000);
</script>
