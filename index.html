<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IV-X Field</title>
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--bg:#f3f2ee;--card:#fff;--ink:#15171b;--mute:#6b6f76;--line:#e5e2db;--water:#d9e6ef;--land:#fbfaf7;--road:#e3e0d8;--road2:#d2cec4;
 --sold:#16a34a;--no:#dc2626;--fu:#d97706;--skip:#64748b;--todo:#c9c5bb;--pro:#16a34a;--acc:#111316}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:#111316;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0;font:800 22px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.4px}
.top h1 span{color:#5eead4}
.sync{font-size:11px;color:#a7abb3;display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:#777;display:inline-block}
.sync.ok i{background:#22c55e}.sync.warn i{background:#f59e0b}.sync.bad i{background:#ef4444}
.days{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{all:unset;flex:1 1 0;min-width:0;text-align:center;padding:7px 8px 6px;border-radius:10px;background:#22252b;color:#cfd2d8;font-weight:700;font-size:13px;cursor:pointer;position:relative;overflow:hidden}
.days button small{display:block;font-size:10px;font-weight:600;opacity:.75;margin-top:1px}
.days button.on{background:#fff;color:#111}
.days button .bar{position:absolute;left:0;bottom:0;height:3px;background:#22c55e}
.prog{padding:12px 14px 4px}
.pbar{height:8px;border-radius:99px;background:#e2dfd7;overflow:hidden;display:flex}
.pbar span{display:block;height:100%}
.pnums{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mute)}
.pnums b{color:var(--ink);font-size:16px;display:block;font-family:'Barlow Condensed';font-weight:700}
.ctrl{display:flex;gap:8px;padding:8px 14px;align-items:center}
.seg{display:flex;background:#e7e4dc;border-radius:10px;padding:3px;flex:1}
.seg button{all:unset;flex:1;text-align:center;padding:7px 0;border-radius:8px;font-weight:700;font-size:13px;color:#555;cursor:pointer}
.seg button.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ib{all:unset;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.mapbox{margin:4px 14px 8px;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:none}
.mapbox.on{display:block}
svg.map{display:block;width:100%;height:auto;background:var(--water)}
.list{padding:0 14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:12px;display:grid;grid-template-columns:36px 1fr;gap:10px;cursor:pointer;position:relative}
.st.done{opacity:.92}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 15px 'Barlow Condensed';color:#fff;background:var(--todo)}
.st.pro .num{border-radius:9px;background:#fff;color:var(--pro);border:2px dashed var(--pro)}
.st h3{margin:0;font-size:15.5px;line-height:1.25}
.addr{font-size:13px;color:var(--mute);margin-top:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.c-order{background:#e0f0ff;color:#0b5ea8}.c-collect{background:#fff1d6;color:#8a5a00}.c-warn,.c-ticket{background:#fde4e1;color:#b42318}
.c-winback{background:#f1e6fb;color:#6b2fa0}.c-check{background:#eeeeec;color:#555}.c-new{background:#dcfce7;color:#166534}
.c-fix{background:#d9f5f2;color:#0f766e}.c-vip{background:#fff7c2;color:#7a5b00}.c-pro{background:#dcfce7;color:#166534}.c-walk{background:#e0e7ff;color:#3730a3}.c-lr{background:#ffedd5;color:#9a3412}.c-prem{background:#ede9fe;color:#5b21b6}
.note{font-size:12.5px;margin-top:6px;color:#4b4f56;background:#f7f5ef;border-radius:8px;padding:6px 8px}
.res{margin-top:8px;font-size:13px;border-top:1px dashed var(--line);padding-top:7px}
.res b.s-sold{color:var(--sold)}.res b.s-no{color:var(--no)}.res b.s-fu{color:var(--fu)}.res b.s-skip{color:var(--skip)}
.acts{display:flex;gap:6px;margin-top:9px}
.acts a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13px;padding:8px 0;border-radius:9px;background:#f1efe9;color:#111}
.addbtn{display:block;margin:14px;padding:14px;text-align:center;border:2px dashed #c9c5bb;border-radius:14px;font-weight:700;color:#555;cursor:pointer;background:transparent;width:calc(100% - 28px);font-size:15px}
.empty{padding:30px 14px;text-align:center;color:var(--mute)}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{all:unset;flex:1;text-align:center;padding:10px 0 9px;font-weight:700;font-size:12px;color:#888;cursor:pointer}
.tabs button .ic{display:block;font-size:19px;line-height:1;margin-bottom:3px}
.tabs button.on{color:#111}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease;padding:0 16px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.grab{width:42px;height:5px;border-radius:9px;background:#ddd;margin:9px auto 4px}
.sheet h2{margin:6px 0 2px;font-size:19px}
.sheet .sub{color:var(--mute);font-size:13px}
.lab{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#777;margin:16px 0 7px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outs button{all:unset;cursor:pointer;text-align:center;padding:13px 6px;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:14.5px}
.outs button[data-s=sold].on{background:var(--sold);border-color:var(--sold);color:#fff}
.outs button[data-s=no].on{background:var(--no);border-color:var(--no);color:#fff}
.outs button[data-s=fu].on{background:var(--fu);border-color:var(--fu);color:#fff}
.outs button[data-s=skip].on{background:var(--skip);border-color:var(--skip);color:#fff}
.step{display:flex;align-items:center;gap:10px}
.step button{all:unset;cursor:pointer;width:46px;height:46px;border-radius:12px;background:#f1efe9;text-align:center;font-size:24px;font-weight:700;line-height:46px}
.step input{width:80px;text-align:center;font:800 26px 'Barlow Condensed';border:2px solid var(--line);border-radius:12px;padding:6px}
.qc{display:flex;flex-wrap:wrap;gap:6px}
.qc button{all:unset;cursor:pointer;padding:7px 11px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600}
.qc button.on{background:#111;color:#fff;border-color:#111}
textarea,input[type=text],input[type=number],input[type=tel]{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:inherit}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.save{all:unset;cursor:pointer;display:block;text-align:center;width:100%;padding:15px 0;border-radius:14px;background:#111;color:#fff;font-weight:800;font-size:16px;margin-top:18px;box-sizing:border-box}
.save:disabled{opacity:.5}
.clear{all:unset;cursor:pointer;display:block;text-align:center;width:100%;padding:12px 0;color:#b42318;font-weight:700;font-size:14px;margin-top:6px}
.who{font-size:12px;color:var(--mute);margin-top:10px;text-align:center}
.banner{margin:10px 14px 0;padding:9px 12px;border-radius:10px;font-size:13px;background:#fff7e6;border:1px solid #f5d48a;color:#7a5200;display:none}
.banner.on{display:block}
/* summary */
.sum{padding:12px 14px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.k b{display:block;font:800 26px/1 'Barlow Condensed'}
.k small{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.sec h4{margin:0;padding:11px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
.sec .it{padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px}
.sec .it:first-of-type{border-top:0}
.sec .it .m{color:var(--mute);font-size:12.5px}
.scope{display:flex;gap:6px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media(min-width:700px){main{max-width:640px;margin:0 auto}}
.ghead h2{margin:6px 0 2px;font-size:22px}.ghead .m{color:#6b675f;font-size:13px;margin-bottom:8px}
.gareas{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.gareas::-webkit-scrollbar{display:none}
.gareas button{flex:none;border:1px solid #e3e0d8;background:#fff;border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;color:#111}
.gareas button small{margin-left:5px;color:#8a867d;font-weight:600}.gareas button.on{background:#111;color:#fff;border-color:#111}.gareas button.on small{color:#bbb}
.gpitch{background:#fff;border:1px solid #e3e0d8;border-radius:12px;padding:10px 12px;margin:10px 0}.gpitch summary{font-weight:800;cursor:pointer;display:flex;gap:6px;align-items:center}
.gpitch ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.45}.gpitch li{margin:3px 0}
.gleg{display:flex;gap:8px;align-items:center;justify-content:center;background:#1a73e8;color:#fff;text-decoration:none;font-weight:800;border-radius:12px;padding:12px;margin:8px 0}
.garea{font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#6b675f;margin:14px 2px 6px}
.c-gym{background:#111;color:#fff}
.st.gym .num .i{width:16px;height:16px}
#v-gym{padding:0 14px 20px}#v-gym .prog,#v-gym .ctrl{padding-left:0;padding-right:0}#v-gym .ghead{padding-top:8px}
.c-shop{background:#e3f5e1;color:#1f6b2b;text-decoration:none}.c-shoperr{background:#fde8e8;color:#b42318}
.tgl{display:flex;gap:8px;align-items:center;font-weight:700;margin:10px 0 2px}.tgl input{width:20px;height:20px}
.shrow{display:block;margin:8px 0}.shrow span{display:block;font-weight:700;font-size:13px;margin-bottom:3px}.shrow select{width:100%;padding:9px;border-radius:9px;border:1px solid #d9d5cc;background:#fff;font-size:14px}
.c-portal{background:#ede9fe;color:#5b21b6}

.gear{all:unset;cursor:pointer;font-size:18px;padding:2px 4px;margin-left:8px;color:#cfd2d8}
.setbox{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 14px}
.setbox summary{list-style:none;cursor:pointer}.setbox summary::-webkit-details-marker{display:none}
.setbox summary h3{margin:0;font-size:15.5px;display:flex;align-items:center;gap:10px}.setbox summary h3 .i{width:18px;height:18px;color:#0f766e}
.setbox summary h3:after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid #aaa;border-bottom:2px solid #aaa;transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
.setbox[open] summary h3:after{transform:rotate(-135deg);margin-top:4px}
.setbox p{margin:8px 0 10px;color:var(--mute);font-size:13px}
.setbox label.m,.row3 label{display:block;font-size:11.5px;color:var(--mute);font-weight:700}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btn2{all:unset;cursor:pointer;flex:1;text-align:center;padding:11px 0;border-radius:11px;background:#f1efe9;font-weight:700;font-size:14px;text-decoration:none;color:#111}
.btn2.dark{background:#111;color:#fff}.btn2:disabled{opacity:.5}
.msg{font-size:13px;margin-top:8px}
.install{display:none;margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:#ecfeff;border:1px solid #a5f3fc;color:#155e75;font-size:13px}
.install.on{display:block}.install b{cursor:pointer;text-decoration:underline}
.gcard{background:#fff;border:1px solid var(--line);border-radius:14px;margin:6px 14px 4px;padding:12px}
.gcard .gt{display:flex;justify-content:space-between;align-items:center;gap:8px}.gcard h4{margin:0;font-size:14px}
.gcard .gl{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.35}
.gbtn{all:unset;cursor:pointer;display:block;text-align:center;margin-top:10px;padding:12px 0;border-radius:11px;background:#1a73e8;color:#fff;font-weight:800;font-size:15px;text-decoration:none}
.gbtn.sec2{background:#e8f0fe;color:#1a56c4;font-size:13px;padding:9px 0;margin-top:7px}
#gmap{width:100%;height:380px;background:#e5e3df}.mapnote{font-size:11.5px;color:var(--mute);padding:6px 10px;background:#fff}
.m{font-size:12px;color:var(--mute)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumb{width:62px;height:62px;object-fit:cover;border-radius:9px;background:#eee;display:block}
.thumbs.edit .tw{position:relative}.tx{all:unset;cursor:pointer;position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#111;color:#fff;font-size:11px;text-align:center;line-height:20px}
.addph{width:62px;height:62px;border-radius:9px;border:2px dashed #c9c5bb;display:grid;place-items:center;font-size:24px;cursor:pointer}
.order{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.orow{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}.orow:first-child{border-top:0}
.otot{display:flex;justify-content:space-between;padding:10px;background:#f7f5ef;font-size:15px}
.step.sm button{width:38px;height:38px;line-height:38px;font-size:20px}.step.sm{gap:6px}.qv{min-width:26px;text-align:center;font:800 20px 'Barlow Condensed'}
.comeback{margin-top:8px;background:#eef6ff;border-left:3px solid #1a73e8;border-radius:0 10px 10px 0;padding:8px 10px;font-size:13.5px}
.comeback b{display:block;font-size:12px;color:#1a56c4;margin-bottom:2px}
details.hist{margin-top:10px;background:#f7f5ef;border-radius:12px;padding:8px 10px}details.hist summary{font-weight:700;font-size:13px;cursor:pointer}
.hrow{font-size:13px;padding:6px 0;border-top:1px solid #e9e5da}.hrow:first-of-type{border-top:0}
.hrow b.s-sold{color:var(--sold)}.hrow b.s-no{color:var(--no)}.hrow b.s-fu{color:var(--fu)}.hrow b.s-skip{color:var(--skip)}
.sigpad{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:grid;place-items:center;padding:14px}
.sigbox{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:560px}.sigbox h3{margin:0 0 8px}
#sigc{width:100%;height:200px;border:2px dashed #c9c5bb;border-radius:12px;touch-action:none;background:#fff;margin-bottom:8px}
.sigimg{max-width:220px;border:1px solid var(--line);border-radius:8px;display:block}.sigshow .btn2{margin-top:6px;display:block}
.fres{margin-top:10px}.frow{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fbtns{display:flex;flex-direction:column;gap:6px;min-width:76px}.fbtns .btn2{padding:8px 0;font-size:13px}
.qlink{padding:7px 11px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:#111;text-decoration:none}
.funnel{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 8px}.fstep{text-align:center}
.fstep span{display:block;height:5px;border-radius:9px;margin-bottom:5px}.fstep b{font:800 20px 'Barlow Condensed';display:block}.fstep small{font-size:9.5px;color:var(--mute);font-weight:700;line-height:1.1;display:block}
.ptab{width:100%;border-collapse:collapse;font-size:13px}.ptab th{text-align:left;font-size:10.5px;color:var(--mute);text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--line)}.ptab td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.prow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.tx2{all:unset;cursor:pointer;color:#b42318;font-size:12.5px;font-weight:700;margin-top:6px;display:inline-block}
.bdg{font-style:normal;background:#dc2626;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px;margin-left:2px;vertical-align:top}
.tabs button{font-size:11px}
input[type=date],input[type=email]{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:inherit}
.login{position:fixed;inset:0;z-index:90;background:#111316;display:none;place-items:center;padding:20px}
.login.on{display:grid}.lbox{width:100%;max-width:380px;color:#fff}
.lbox h1{font:800 34px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 8px}.lbox h1 span{color:#5eead4}
.lbox p{color:#a7abb3;font-size:14px;margin:0 0 16px}.lbox input{width:100%;font:inherit;font-size:16px;border:1.5px solid #33363d;background:#1b1e23;color:#fff;border-radius:12px;padding:12px;margin-bottom:10px}

.i{width:1em;height:1em;vertical-align:-.14em;flex:none;display:inline-block}
.tabs button .ic{display:flex;justify-content:center;margin-bottom:4px;position:relative}.tabs button .ic svg{width:22px;height:22px}.tabs button .ic .i{width:22px;height:22px}

function project(pts,W){
  let la0=Infinity,la1=-Infinity,ln0=Infinity,ln1=-Infinity;
  pts.forEach(([a,b])=>{la0=Math.min(la0,a);la1=Math.max(la1,a);ln0=Math.min(ln0,b);ln1=Math.max(ln1,b)});
  const k=Math.cos(40.75*Math.PI/180);
  let w=(ln1-ln0)*k, h=(la1-la0);
  const pad=Math.max(w,h)*0.09; la0-=pad;la1+=pad;ln0-=pad/k;ln1+=pad/k; w=(ln1-ln0)*k; h=la1-la0;
  // keep aspect between 0.7 and 1.35
  const minAR=0.75,maxAR=1.3; let ar=h/w;
  if(ar<minAR){const ex=(minAR*w-h)/2;la0-=ex;la1+=ex;h=la1-la0}
  if(ar>maxAR){const ex=(h/maxAR-w)/2/k;ln0-=ex;ln1+=ex;w=(ln1-ln0)*k}
  const H=Math.round(W*h/w), s=W/w;
  return {W,H,s,f:([a,b])=>[((b-ln0)*k*s),((la1-a)*s)]};
}

function parseRow(r){const o={};for(const k in r){o[k]=r[k]===''?undefined:r[k]}
  ['reasons','alsoDone','photos'].forEach(k=>o[k]=Array.isArray(o[k])?o[k]:(o[k]?String(o[k]).split(' | ').filter(Boolean):[]));
  if(!Array.isArray(o.items)){try{o.items=o.items?JSON.parse(o.items):[]}catch(e){o.items=[]}}
  ['cases','freeCans','freeCases'].forEach(k=>o[k]=o[k]?+o[k]:0);
  o.deleted=String(o.deleted).toUpperCase()==='TRUE'; o.id=String(o.id);
  if(!o.storeKey&&o.store)o.storeKey=storeKeyOf(o.store,o.address); return o}
function allEvents(){ // server log + this phone's unsynced saves
  const seen=new Set(), out=[];
  serverLog.forEach(e=>{const k=e.id+'@'+e.at;if(!seen.has(k)){seen.add(k);out.push(e)}});
  outbox.forEach(id=>{const r=recs[id];if(r&&r.at){const k=r.id+'@'+r.at;if(!seen.has(k)){seen.add(k);out.push(r)}}});
  Object.values(recs).forEach(r=>{if(r.at){const k=r.id+'@'+r.at;if(!seen.has(k)){seen.add(k);out.push(r)}}});
  return out;
}
function storeTimeline(key){ // latest save per record id, newest first
  const latest={};
  allEvents().forEach(e=>{if(e.storeKey!==key)return;if(!latest[e.id]||String(latest[e.id].at)<String(e.at))latest[e.id]=e});
  return Object.values(latest).filter(e=>!e.deleted&&e.status).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}

function stageOf(key,tl){tl=tl||storeTimeline(key);if(!tl.length)return'Prospect';
  const sold=tl.filter(e=>e.status==='sold').length;
  if(sold>=3)return'Regular';if(sold===2)return'Reorder';if(sold===1)return'First order';
  if(tl[0].status==='no'&&(tl[0].reasons||[]).includes('Not interested'))return'Lost';
  if(tl.some(e=>e.freeCans||e.freeCases||(e.alsoDone||[]).includes('Samples left')))return'Sampled';

function dueList(){

async function uploadMedia(r){ // turn local:pid tokens into sb:path. returns false if something is still waiting
  let ok=true;
  const one=async tok=>{if(!String(tok).startsWith('local:'))return tok;const pid=tok.slice(6);const b=await IDB.get(pid).catch(()=>null);if(!b)return null;
    try{const blob=await (await fetch(b.dataUrl)).blob();const path=(b.name.match(/_(\d{4}-\d{2}-\d{2})_/)||[0,ymd()])[1]+'/'+b.name;
      const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:b.mime,upsert:true});if(error)throw error;await IDB.del(pid);return'sb:'+path}catch(e){ok=false;return tok}};
  if(r.photos&&r.photos.some(t=>String(t).startsWith('local:'))){const np=[];for(const t of r.photos){const v=await one(t);if(v)np.push(v)}r.photos=np}
  if(r.signature&&String(r.signature).startsWith('local:'))r.signature=(await one(r.signature))||'';
  return ok;
}

    if(cfg&&cfg.length&&!configDirty){const m={};cfg.forEach(x=>m[x.key]=x.value);const c=defaultConfig();config={products:m.products||c.products,pitch:m.pitch||c.pitch,settings:Object.assign(c.settings,m.settings||{})};LS.set('config',config)}

  let el=$('#login');if(!el){el=document.createElement('div');el.id='login';document.body.appendChild(el)}
  el.className='login on';
  el.innerHTML=`<div class="lbox"><h1>IV-X <span>Field</span></h1><p>Sign in with the email and password your manager set up for you.</p>
   <input id="le" type="email" autocomplete="username" placeholder="Email" value="${esc(LS.get('lastEmail',''))}"><input id="lp" type="password" autocomplete="current-password" placeholder="Password">
   <button class="save" id="lgo">Sign in</button><div class="lmsg" id="lmsg">${esc(msg||'')}</div>
   ${Object.keys(recs).length?'':'<button class="clear" style="color:#9aa" id="lskip">Not now — use on this phone only</button>'}</div>`;
  const go=async()=>{const email=$('#le').value.trim(),password=$('#lp').value;if(!email||!password){$('#lmsg').textContent='Enter your email and password.';return}
    $('#lgo').disabled=true;$('#lmsg').textContent='Signing in…';
    try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;session=data.session;LS.set('lastEmail',email);
      if(!myName())LS.set('name',email.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()));
      el.classList.remove('on');Object.keys(recs).forEach(id=>{if(!outbox.includes(id))outbox.push(id)});persist();startRealtime();await syncNow();toast('Signed in as '+email)}
    catch(e){$('#lgo').disabled=false;$('#lmsg').textContent=/invalid/i.test(e.message||'')?'Wrong email or password.':(navigator.onLine?'Couldn\'t sign in: '+(e.message||e):'You\'re offline — connect to sign in.')}};
  $('#lgo').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
  if($('#lskip'))$('#lskip').onclick=()=>{el.classList.remove('on');LS.set('skipLogin',true)};
}
async function boot(){
  if(!sb){syncLabel();return}
  try{session=(await sb.auth.getSession()).data.session}catch(e){session=null}
  sb.auth.onAuthStateChange((ev,s)=>{session=s;if(ev==='SIGNED_OUT'){stopRealtime()}syncLabel()});
  if(session){startRealtime();syncNow()}else if(!LS.get('skipLogin',false))showLogin();
  syncLabel();
}

// ===================== media helpers =====================
const thumbCache={};
function mediaSrc(tok){tok=String(tok||'');
  if(tok.startsWith('sb:'))return SB_URL+'/storage/v1/object/public/photos/'+tok.slice(3).split('/').map(encodeURIComponent).join('/');
  if(tok.startsWith('drive:'))return'https://drive.google.com/thumbnail?id='+tok.slice(6)+'&sz=w600';
  if(tok.startsWith('local:')){const pid=tok.slice(6);if(thumbCache[pid])return thumbCache[pid];
    IDB.get(pid).then(b=>{if(b){thumbCache[pid]=b.dataUrl;document.querySelectorAll(`img[data-pid="${pid}"]`).forEach(i=>i.src=b.dataUrl)}}).catch(()=>{});return''}
  return tok}
const mediaOpen=tok=>String(tok).startsWith('sb:')?mediaSrc(tok):String(tok).startsWith('drive:')?'https://drive.google.com/file/d/'+String(tok).slice(6)+'/view':null;
function imgTag(tok,cls){const pid=String(tok).startsWith('local:')?String(tok).slice(6):'';const src=mediaSrc(tok);const href=mediaOpen(tok);
  const im=`<img class="${cls||'thumb'}" ${pid?`data-pid="${pid}"`:''} src="${esc(src)}" alt="photo" loading="lazy">`;
  return href?`<a href="${href}" target="_blank" rel="noopener" data-stop>${im}</a>`:im}
function resizeImage(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function stashMedia(dataUrl,recName,kind){const pid=kind[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const mime=dataUrl.slice(5,dataUrl.indexOf(';'));
  await IDB.put({pid,dataUrl,mime,name:`${slug(recName)}_${ymd()}_${pid}.${mime.includes('png')?'png':'jpg'}`,desc:`${recName} — ${kind} — ${new Date().toLocaleString()}`});
  thumbCache[pid]=dataUrl;return'local:'+pid}

// ===================== product math =====================
const unitCost=p=>p.casePrice&&p.unitsPerCase?p.casePrice/p.unitsPerCase:null;
const marginOf=p=>{const u=unitCost(p);return u!=null&&p.srp?{per:p.srp-u,pct:(p.srp-u)/p.srp}:null};
function avgUnitCost(){const xs=P().map(unitCost).filter(x=>x!=null);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null}
function avgCase(){const xs=P().map(p=>+p.casePrice).filter(Boolean);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null}
function fillTokens(t){const p=P().find(x=>marginOf(x))||P()[0]||{};const m=marginOf(p);const u=unitCost(p);
  return String(t).replace(/\{margin\}/g,m?money(m.per)+' ('+Math.round(m.pct*100)+'%)':'[set prices in Settings]').replace(/\{unitCost\}/g,u!=null?money(u):'[cost per can]').replace(/\{srp\}/g,p.srp?money(p.srp):'[shelf price]')}

// ===================== render: shell =====================
function render(){renderDays();renderTabBadges();
  if(tab==='route')renderRoute();else if(tab==='gym')renderGyms();else if(tab==='due')renderDue();else if(tab==='pitch')renderPitch();else if(tab==='sum')renderSum();else renderSet();syncLabel()}
function dayStats(k){const st=stopsFor(k);let c={sold:0,no:0,fu:0,skip:0,todo:0,cases:0,paid:0,orders:0,cost:0};
  st.forEach(s=>{const v=statusOf(s);if(!v)c.todo++;else{c[v.status]=(c[v.status]||0)+1;c.cases+=+v.cases||0;c.paid+=parseFloat(v.paid)||0;c.orders+=parseFloat(v.orderTotal)||0;c.cost+=parseFloat(v.sampleCost)||0}});c.total=st.length;c.done=c.total-c.todo;return c}
function renderDays(){
  const show=tab==='route'||tab==='sum';$('#days').style.display=show?'flex':'none';
  $('#days').innerHTML=DAYS.map(D=>{const c=dayStats(D.k);return `<button data-k="${D.k}" class="${D.k===day?'on':''}">${D.d}<small>${c.done}/${c.total}</small><span class="bar" style="width:${(c.done/c.total*100).toFixed(0)}%;background:${HEX[D.k]}"></span></button>`}).join('');
  $('#days').querySelectorAll('button').forEach(b=>b.onclick=()=>{day=b.dataset.k;LS.set('day',day);render();window.scrollTo(0,0)});

function renderTabBadges(){const t=ymd();const n=dueList().filter(d=>d.due<=t).length;const b=document.querySelector('.tabs button[data-t=due] .ic');if(b)b.innerHTML=I('repeat')+(n?`<em class="bdg">${n}</em>`:'');const g=document.querySelector('.tabs button[data-t=gym] .ic');if(g){const m=gymDue();g.innerHTML=I('users')+(m?`<em class="bdg">${m}</em>`:'')}}
const icon=st=>I(st==='sold'?'check':st==='no'?'x':st==='fu'?'refresh':'minus');
const glyph=st=>st==='sold'?'✓':st==='no'?'✕':st==='fu'?'↻':'–'; // plain text marks for map pins
const fullAddr=(s,k)=>{const a=(s.addr||'').replace(/\s*\(.*?\)/g,'').trim();const city=(['mon','tue'].includes(k)?'Queens, NY':'New York, NY');if(!a)return s.name+', '+city;
  if(/ny\b|queens|astoria|long island city|new york|brooklyn|bronx/i.test(a))return(s.kind!=='acct'?s.name+', ':'')+a;return(s.kind!=='acct'?s.name+', ':'')+a+', '+city};
const navLink=(s,k)=>'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(s.lat&&s.kind==='walk'&&!s.addr?s.lat+','+s.lng:fullAddr(s,k));

      (stg!=='Prospect'?`<span class="chip" style="background:${STAGE_COL[stg]}1f;color:${STAGE_COL[stg]}">${stg.toUpperCase()}</span>`:'')+(scans[s.storeKey]?`<span class="chip c-order">${I('qr')} ${scans[s.storeKey]} QR scans</span>`:'');
    const ph=(s.contact||'').match(/\d{3}-?\d{3}-?\d{4}/);
    const numStyle=v?`background:${SC[v.status]};color:#fff;border:0;border-radius:50%`:(s.kind==='acct'?`background:${HEX[day]}`:s.kind==='walk'?'background:#4f46e5':'');

    o+=`<div class="st ${s.kind==='prospect'?'pro':''}" data-id="${esc(s.id)}">
      <div class="num" style="${numStyle}">${v?icon(v.status):s.seq}</div>

      ${chips?`<div class="chips">${chips}</div>`:''}${v?resLine(v):''}${pics}
      <div class="acts"><a href="${navLink(s,day)}" target="_blank" rel="noopener" data-stop>Navigate</a>${ph?`<a href="tel:${ph[0].replace(/-/g,'')}" data-stop>Call</a>`:''}<a href="#" data-open>${v?'Edit':'Check in'}</a></div>
      </div></div>`;
  });

function resLine(v){
  const b=[];if(v.status==='sold'&&v.cases)b.push(`<b>${v.cases} cs</b>`);if(v.orderTotal)b.push(money(v.orderTotal));if(v.bought)b.push(esc(v.bought));
  if((v.reasons||[]).length)b.push(esc(v.reasons.join(', ')));if((v.alsoDone||[]).length)b.push(esc(v.alsoDone.join(', ')));
  if(v.freeCans||v.freeCases)b.push(`${I('gift')} ${v.freeCases?v.freeCases+' free cs ':''}${v.freeCans?v.freeCans+' cans':''}`);
  if(v.paid)b.push(`${I('cash')} ${money(v.paid)}`);if(v.signature)b.push(I('pen')+' signed');if(v.followUpDate)b.push(`${I('calendar')} ${v.status==='sold'?'reorder':'follow up'} ${fmtDate(v.followUpDate)}`);if(v.notes)b.push('“'+esc(v.notes)+'”');
  const t=v.at?new Date(v.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';const pend=outbox.includes(v.id)?' · '+I('clock')+' not uploaded yet':'';
  return `<div class="res"><b class="s-${v.status}">${SL[v.status]}</b>${b.length?' — '+b.join(' · '):''}<div style="color:var(--mute);font-size:11.5px;margin-top:2px">${v.by?esc(v.by)+' · ':''}${t}${pend}</div></div>`;
}
const fmtDate=d=>{if(!d)return'';const x=new Date(d+'T12:00:00');return x.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})};

// ----- Google Maps: legs card, live map -----
const LEG=4;
function legLink(stops,k){const enc=encodeURIComponent;const a=s=>s.lat&&s.kind==='walk'&&!s.addr?s.lat+','+s.lng:fullAddr(s,k||s.day||day);const dest=stops[stops.length-1],wps=stops.slice(0,-1);
  return'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+enc(a(dest))+(wps.length?'&waypoints='+wps.map(s=>enc(a(s))).join('%7C'):'')}
function renderGCard(){
  const todo=stopsFor(day).filter(s=>!statusOf(s));
  let o=`<div class="gcard">`;
  if(todo.length){const next=todo.slice(0,LEG),legs=Math.ceil(todo.length/LEG);
    o+=`<div class="gt"><h4>${I('nav')} Drive the next ${next.length} stop${next.length>1?'s':''}</h4><span style="font-size:12px;color:var(--mute)">${todo.length} left · ${legs} leg${legs>1?'s':''}</span></div>
   <div class="gl">${next.map(s=>`<b>${s.seq}</b> ${esc(s.name)}`).join(' → ')}</div>
   <a class="gbtn" href="${legLink(next)}" target="_blank" rel="noopener">Open in Google Maps</a>
   ${todo.length>LEG?`<a class="gbtn sec2" href="${legLink(todo.slice(LEG,LEG*2))}" target="_blank" rel="noopener">Then: stops ${todo.slice(LEG,LEG*2).map(s=>s.seq).join(', ')}</a>`:''}`}
  else o+=`<div class="gt"><h4>${I('check')} Route done for ${DAYS.find(d=>d.k===day).d}</h4></div>`;
  o+=`<button class="gbtn sec2" id="finder" style="width:100%;box-sizing:border-box;background:#f0fdf4;color:#166534">${I('search')} Find new stores near me</button></div>`;
  $('#gcard').innerHTML=o;$('#finder').onclick=openFinder;
}
let gLoad=null,gmap=null,gMarkers=[],gLine=null,gMe=null,gDay=null,geoCache=LS.get('geo',{});
function loadGoogle(){
  if(window.google&&google.maps&&google.maps.Map)return Promise.resolve();
  if(gLoad)return gLoad;
  gLoad=new Promise((res,rej)=>{window.__gmReady=res;window.gm_authFailure=()=>{rej(new Error('Google rejected the API key'));gLoad=null};
    const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(mapsKey())+'&callback=__gmReady&loading=async&v=weekly';
    s.async=true;s.onerror=()=>{rej(new Error('Couldn\'t load Google Maps (offline?)'));gLoad=null};document.head.appendChild(s)});
  return gLoad;
}
function geocode(geocoder,addr){if(geoCache[addr])return Promise.resolve(geoCache[addr]);
  return new Promise(res=>geocoder.geocode({address:addr,region:'us'},(r,st)=>{if(st==='OK'&&r[0]){const l=r[0].geometry.location;geoCache[addr]=[l.lat(),l.lng()];LS.set('geo',geoCache);res(geoCache[addr])}else res(null)}))}
function pin(color,label,dashed){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44"><path d="M17 43s14-14.6 14-25A14 14 0 0 0 3 18c0 10.4 14 25 14 25z" fill="${dashed?'#fff':color}" stroke="${dashed?'#16a34a':'#fff'}" stroke-width="2.5" ${dashed?'stroke-dasharray="4 3"':''}/><text x="17" y="22" font-family="Arial" font-weight="700" font-size="${String(label).length>1?12:14}" fill="${dashed?'#15803d':'#fff'}" text-anchor="middle">${label}</text></svg>`;
  return{url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),scaledSize:new google.maps.Size(34,44),anchor:new google.maps.Point(17,43)}}
const HEXS={sold:'#16a34a',no:'#dc2626',fu:'#d97706',skip:'#64748b'};
async function drawGoogleMap(){
  const box=$('#mapbox');
  if(!box.querySelector('#gmap')){box.innerHTML='<div id="gmap"></div><div class="mapnote" id="gnote">Loading Google Maps…</div>';gmap=null}
  try{await loadGoogle()}catch(e){box.innerHTML=miniMap(day)+`<div class="mapnote">${I('alert')} ${esc(e.message)} — showing the sketch map instead. Check the key under Settings.</div>`;gmap=null;return}
  if(!gmap){gmap=new google.maps.Map($('#gmap'),{center:{lat:40.75,lng:-73.93},zoom:13,clickableIcons:false,streetViewControl:false,mapTypeControl:false,fullscreenControl:true,gestureHandling:'greedy'});gDay=null}
  const geocoder=new google.maps.Geocoder();const st=stopsFor(day);const pts=[];
  for(const s of st){let ll=s.kind==='walk'&&s.lat?[s.lat,s.lng]:geoCache[fullAddr(s,day)]||null;if(!ll)ll=await geocode(geocoder,fullAddr(s,day));if(!ll&&s.lat)ll=[s.lat,s.lng];pts.push(ll)}
  gMarkers.forEach(m=>m.setMap(null));gMarkers=[];if(gLine)gLine.setMap(null);
  const bounds=new google.maps.LatLngBounds();const path=[];
  st.forEach((s,i)=>{const ll=pts[i];if(!ll)return;const pos={lat:ll[0],lng:ll[1]};path.push(pos);bounds.extend(pos);const v=statusOf(s);
    const m=new google.maps.Marker({position:pos,map:gmap,title:s.seq+'. '+s.name,zIndex:v?1:10,icon:pin(v?HEXS[v.status]:(s.kind==='walk'?'#4f46e5':HEX[day]),v?glyph(v.status):s.seq,!v&&s.kind==='prospect')});
    m.addListener('click',()=>openStop(s.id));gMarkers.push(m)});
  gLine=new google.maps.Polyline({path,map:gmap,strokeColor:HEX[day],strokeOpacity:.7,strokeWeight:3});
  if(gDay!==day&&path.length){gmap.fitBounds(bounds,30);gDay=day}
  const n=$('#gnote');if(n)n.innerHTML='Tap a pin to check in · <b id="locme" style="cursor:pointer;color:#1a73e8">Show my location</b>';
  const lm=$('#locme');if(lm)lm.onclick=()=>locate(p=>{const pos={lat:p[0],lng:p[1]};if(gMe)gMe.setMap(null);
    gMe=new google.maps.Marker({position:pos,map:gmap,zIndex:99,icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#1a73e8',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}});gmap.panTo(pos)});
}
function locate(cb,fail){if(!navigator.geolocation){toast('Location not available');fail&&fail();return}
  navigator.geolocation.getCurrentPosition(p=>{here=[p.coords.latitude,p.coords.longitude];cb(here)},()=>{toast('Allow location access to use this');fail&&fail()},{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}
function drawMap(){if(!mapOn)return;if(mapsKey())drawGoogleMap();else $('#mapbox').innerHTML=miniMap(day)}
function miniMap(k){
  const st=stopsFor(k).filter(s=>s.lat!=null&&s.lng!=null);const pr=project(st.map(s=>[s.lat,s.lng]).concat([[PLAN[k].start.lat,PLAN[k].start.lng]]),600);
  const poly=P=>P.map(p=>pr.f(p).map(v=>v.toFixed(1)).join(',')).join(' ');
  let o=`<svg class="map" viewBox="0 0 ${pr.W} ${pr.H}">`;
  LAND.forEach(L=>o+=`<polygon points="${poly(L)}" fill="var(--land)" stroke="#c9d6df"/>`);
  ROADS.forEach(r=>o+=`<polyline points="${poly(r.p)}" fill="none" stroke="${!r.ave&&!r.x?'var(--road2)':'var(--road)'}" stroke-width="${!r.ave&&!r.x?3:1.5}"/>`);
  HOODS.forEach(([n,a,b])=>{const [x,y]=pr.f([a,b]);if(x<20||y<14||x>pr.W-20||y>pr.H-8)return;o+=`<text x="${x}" y="${y}" font-size="13" fill="#9a958a" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" letter-spacing="1.3">${esc(n.toUpperCase())}</text>`});
  o+=`<polyline points="${poly([[PLAN[k].start.lat,PLAN[k].start.lng]].concat(st.map(s=>[s.lat,s.lng])))}" fill="none" stroke="${HEX[k]}" stroke-width="2.5" stroke-linejoin="round" opacity=".8"/>`;
  st.forEach((s,i)=>{const [x,y]=pr.f([s.lat,s.lng]);const v=statusOf(s);
    o+=s.kind==='prospect'&&!v?`<rect x="${x-9}" y="${y-9}" width="18" height="18" rx="3" transform="rotate(45 ${x} ${y})" fill="#fff" stroke="var(--pro)" stroke-width="2" stroke-dasharray="3 2"/><text x="${x}" y="${y+4}" font-size="10" font-weight="800" text-anchor="middle" fill="#15803d" font-family="Inter">${i+1}</text>`
      :`<circle cx="${x}" cy="${y}" r="11" fill="${v?SC[v.status]:HEX[k]}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" font-size="${v?12:10.5}" font-weight="800" text-anchor="middle" fill="#fff" font-family="Inter">${v?glyph(v.status):i+1}</text>`});
  return o+'</svg>';
}

// ===================== store finder =====================
function openFinder(){
  const sh=$('#sheet');cur=null;
  const q=t=>'https://www.google.com/maps/search/'+encodeURIComponent(t+' near me');
  sh.innerHTML=`<div class="grab"></div><h2>Find new stores near you</h2><div class="sub">Delis, bodegas, grocers and gas stations close by that aren't on your list yet.</div>
   <div id="fres" class="fres">${mapsKey()?'<div class="empty">Getting your location…</div>':'<div class="note" style="margin-top:12px">Add a Google Maps key in Settings to list nearby stores right here with one-tap “Add to route.” Until then, these open Google Maps:</div>'}</div>
   <div class="lab">Search Google Maps</div><div class="qc">${['deli','bodega','grocery store','health food store','gas station convenience store','smoke shop'].map(t=>`<a class="qlink" href="${q(t)}" target="_blank" rel="noopener">${t}</a>`).join('')}</div>
   <button class="clear" style="color:#111" id="fclose">Close</button>`;
  showSheet();$('#fclose').onclick=closeSheet;
  if(!mapsKey())return;
  locate(async ll=>{
    try{await loadGoogle();const {Place}=await google.maps.importLibrary('places');
      const {places}=await Place.searchNearby({fields:['id','displayName','formattedAddress','location','nationalPhoneNumber','primaryTypeDisplayName'],
        locationRestriction:{center:{lat:ll[0],lng:ll[1]},radius:700},includedPrimaryTypes:['convenience_store','grocery_store','supermarket','gas_station'],maxResultCount:20,rankPreference:'DISTANCE'});
      const known=Object.values(directory()).map(d=>slug(d.name));

function sellThrough(key,extra){ // extra = an in-progress visit {at, shelf, items}
  const ev=storeTimeline(key).slice().reverse();if(extra)ev.push(extra);
  const upc=id=>{const p=P().find(x=>x.id===id);return p&&+p.unitsPerCase?+p.unitsPerCase:1};
  let stock=null,lastAt=null,sold={},days=0;
  ev.forEach(e=>{const t=new Date(e.at||Date.now()).getTime();const shelf=e.shelf&&Object.keys(e.shelf).length?e.shelf:null;
    if(shelf&&stock){const d=(t-lastAt)/864e5;if(d>0.5){Object.keys(stock).forEach(pid=>{sold[pid]=(sold[pid]||0)+Math.max(0,(stock[pid]||0)-(+shelf[pid]||0))});days+=d}}
    const next=shelf?Object.fromEntries(Object.entries(shelf).map(([k,v])=>[k,+v||0])):{...(stock||{})};
    (e.items||[]).forEach(i=>{next[i.id]=(next[i.id]||0)+(+i.q||0)*upc(i.id)});
    if((e.items||[]).length||shelf){stock=next;lastAt=t}});
  if(days<0.5)return null;const tot=Object.values(sold).reduce((a,b)=>a+b,0);
  return{perWeek:tot/days*7,byFlavor:Object.fromEntries(Object.entries(sold).map(([k,v])=>[k,v/days*7])),days:Math.round(days)}}

function openSigPad(store,defName,done){
  const pad=document.createElement('div');pad.className='sigpad';
  pad.innerHTML=`<div class="sigbox"><h3>Sign for ${esc(store)}</h3><canvas id="sigc"></canvas><input id="sign" type="text" placeholder="Printed name" value="${esc(defName||'')}">
   <div class="btnrow"><button class="btn2" id="sgx">Cancel</button><button class="btn2" id="sgc">Clear</button><button class="btn2 dark" id="sgo">Done</button></div></div>`;
  document.body.appendChild(pad);
  const c=pad.querySelector('#sigc'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';let down=false,inked=false;
  const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;inked=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{if(!down)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
  c.onpointerup=()=>down=false;
  pad.querySelector('#sgc').onclick=()=>{x.clearRect(0,0,c.width,c.height);inked=false};
  pad.querySelector('#sgx').onclick=()=>pad.remove();
  pad.querySelector('#sgo').onclick=async()=>{if(!inked){toast('Sign in the box first');return}
    const out=document.createElement('canvas');out.width=c.width;out.height=c.height;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);o.drawImage(c,0,0);
    const tok=await stashMedia(out.toDataURL('image/png'),store,'signature');const nm=pad.querySelector('#sign').value.trim();pad.remove();done(tok,nm)};
}

  const box=(id,title,body)=>`<details class="setbox" data-id="${id}" ${setOpen[id]!==false&&(setOpen[id]||['me','sync'].includes(id))?'open':''}><summary><h3>${title}</h3></summary>${body}</details>`;
  const pr=P(),pi=config.pitch||{},st=S();
  let o=box('me',I('user')+'Your name',`<p>Shows next to every check-in you make.</p><input id="nm" type="text" placeholder="e.g. Nando" value="${esc(myName())}">`);
  o+=box('sync',I('link')+'Account & sync',sb?`<p>${session?`Signed in as <b>${esc(session.user.email)}</b>. Check-ins sync live with everyone on the team.`:'You\'re signed out — check-ins stay on this phone until you sign in.'}</p>
   <div class="msg">${session?(lastOk?'Last synced '+new Date(lastOk).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+(rtLive?' · live updates on':''):(lastErr?I('alert')+' '+esc(lastErr):'Not synced yet')):''}${outbox.length?' · '+outbox.length+' waiting to upload':''}</div>
   <div class="btnrow">${session?'<button class="btn2" id="snow">Sync now</button><button class="btn2" id="sout">Sign out</button>':'<button class="btn2 dark" id="sin">Sign in</button>'}</div>`
   :`<p>Cloud sync isn't set up in this copy of the app yet. Add your Supabase Project URL and publishable key to <b>config.js</b> and upload the folder again (see the setup guide). Until then, check-ins are saved on this phone only.</p>`);
  if(sb)o+=box('invite',I('users')+'Add your team',`<p><b>1.</b> In Supabase, go to <b>Authentication → Users → Add user → Create new user</b>. Enter their email and a password, and tick <b>Auto Confirm User</b>.<br><b>2.</b> Text them this link with their email and password.</p><input type="text" readonly value="${esc(appLink)}" onclick="this.select()"><div class="btnrow"><button class="btn2 dark" id="lcopy">Copy app link</button></div>`);
  o+=box('prod',I('box')+'Products & prices',`<p>Your flavors. Powers the tap-to-order form, order totals, store margin and sample cost. Saved for the whole team.</p>
   <div id="plist">${pr.map((x,i)=>`<div class="prow"><input data-pi="${i}" data-k="name" type="text" placeholder="Flavor" value="${esc(x.name)}"><div class="row3"><label>Case $<input data-pi="${i}" data-k="casePrice" type="number" inputmode="decimal" value="${esc(x.casePrice??'')}"></label><label>Cans/case<input data-pi="${i}" data-k="unitsPerCase" type="number" inputmode="numeric" value="${esc(x.unitsPerCase??'')}"></label><label>Shelf $<input data-pi="${i}" data-k="srp" type="number" inputmode="decimal" value="${esc(x.srp??'')}"></label></div><button class="tx2" data-del="${i}">Remove</button></div>`).join('')}</div>
   <div class="btnrow"><button class="btn2" id="padd">+ Add flavor</button><button class="btn2 dark" id="psave">Save products</button></div>`);
  if(sb)o+=box('shop',I('link')+'Shopify',shopBox());
  o+=box('pitch',I('message')+'Pitch kit',`<p>Shows on the Pitch tab and pops up when you tap a no-sale reason. Use {margin}, {unitCost} and {srp} to fill in numbers from your price list. Edit the [bracketed] parts before you go out.</p>
   <div class="lab">Sell sheet link (PDF, Drive, Canva…)</div><input id="ssu" type="text" placeholder="https://…" value="${esc(pi.sellSheetUrl||'')}">
   <div class="lab">Talking points (one per line)</div><textarea id="pts" rows="7">${esc((pi.points||[]).join('\n'))}</textarea>
   ${NO_CHIPS.map(r=>`<div class="lab">When they say “${esc(r)}”</div><textarea data-obj="${esc(r)}" rows="2">${esc((pi.objections||{})[r]||'')}</textarea>`).join('')}
   <div class="btnrow"><button class="btn2 dark" id="pisave">Save pitch kit</button></div>`);
  o+=box('qr',I('qr')+'QR shelf tags',`<p>Each store gets its own QR tag to stick on the shelf or cooler. Scans are counted per store and send shoppers to this link. Print them from the <a href="dashboard.html#qr" target="_blank">dashboard</a>.</p>
   <input id="qru" type="text" placeholder="https://www.tiktok.com/@yourbrand" value="${esc(st.qrUrl||'')}"><div class="btnrow"><button class="btn2 dark" id="qrsave">Save link</button></div>
`);
  o+=box('rc',I('file')+'Receipts',`<p>Last line on every receipt you text or email to a store.</p><input id="rf" type="text" placeholder="Thank you for carrying IV-X!" value="${esc(st.receiptFooter||'')}"><div class="btnrow"><button class="btn2 dark" id="rfsave">Save</button></div>`);
  o+=box('fu',I('calendar')+'Follow-up timing',`<div class="row2"><label class="m">Reorder check after (days)<input id="rd" type="number" value="${esc(st.reorderDays)}"></label><label class="m">Follow up after (days)<input id="fd" type="number" value="${esc(st.followUpDays)}"></label></div>
   <div class="btnrow"><button class="btn2 dark" id="fusave">Save</button></div>`);
  o+=box('map',I('map')+'Live Google Map',`<p>Paste a Google Maps API key for the live map and the store finder. Without one, the “Open in Google Maps” buttons still work.</p>
   <input id="mk" type="text" placeholder="AIza…" value="${esc(LS.get('mapsKey','')||CFG.MAPS_KEY||'')}"><div class="btnrow"><button class="btn2 dark" id="mksave">Save key</button></div>`);
  o+=box('inst',I('phone')+'Install on your phone',`<p><b>iPhone:</b> open in Safari → Share → <i>Add to Home Screen</i>.<br><b>Android:</b> Chrome ⋮ → <i>Install app</i>.<br>Works without signal; check-ins and photos upload when you're back online.</p>${deferredPrompt?'<div class="btnrow"><button class="btn2 dark" id="inst">Install now</button></div>':''}`);
  o+=box('phone',I('phone')+'This phone',`<p>${Object.values(recs).filter(r=>r.status&&!r.deleted).length} check-ins stored here · ${outbox.length} waiting to upload.</p><div class="btnrow"><button class="btn2" id="wtour">Show welcome tour</button></div><div class="btnrow"><a class="btn2" href="dashboard.html" target="_blank">Manager dashboard</a><button class="btn2" id="reset">Reset this phone</button></div>`);
  $('#v-set').innerHTML=o;
  document.querySelectorAll('#v-set details').forEach(d=>d.ontoggle=()=>{setOpen[d.dataset.id]=d.open;LS.set('setOpen',setOpen)});
  const g=id=>document.getElementById(id);
  bindShop(g);
  g('nm').onchange=()=>{LS.set('name',g('nm').value.trim());toast('Name saved')};
  if(g('snow'))g('snow').onclick=async()=>{await syncNow();renderSet()};
  if(g('sout'))g('sout').onclick=async()=>{if(outbox.length&&!confirm2(g('sout'),`Tap again — ${outbox.length} not uploaded yet`))return;stopRealtime();try{await sb.auth.signOut()}catch(e){}session=null;renderSet();showLogin('Signed out.')};
  if(g('sin'))g('sin').onclick=()=>showLogin();
  if(g('lcopy'))g('lcopy').onclick=()=>copy(appLink,'App link copied');
  const readProds=()=>{document.querySelectorAll('#plist [data-pi]').forEach(inp=>{const x=pr[+inp.dataset.pi];const k=inp.dataset.k;x[k]=k==='name'?inp.value.trim():(inp.value===''?'':+inp.value)})};
  g('padd').onclick=()=>{readProds();pr.push({id:'p'+Date.now().toString(36),name:'',casePrice:'',unitsPerCase:'',srp:''});config.products=pr;setOpen.prod=true;renderSet()};
  document.querySelectorAll('#plist [data-del]').forEach(b=>b.onclick=()=>{readProds();pr.splice(+b.dataset.del,1);config.products=pr;renderSet()});
  g('psave').onclick=()=>{readProds();config.products=pr.filter(x=>x.name);saveConfig()};
  g('pisave').onclick=()=>{const ob={};document.querySelectorAll('[data-obj]').forEach(t=>ob[t.dataset.obj]=t.value.trim());
    config.pitch={sellSheetUrl:g('ssu').value.trim(),points:g('pts').value.split('\n').map(x=>x.trim()).filter(Boolean),objections:ob};saveConfig()};
  g('qrsave').onclick=()=>{config.settings=Object.assign({},config.settings,{qrUrl:g('qru').value.trim()});saveConfig()};
  g('fusave').onclick=()=>{config.settings=Object.assign({},config.settings,{reorderDays:+g('rd').value||14,followUpDays:+g('fd').value||3,});saveConfig()};
  g('rfsave').onclick=()=>{config.settings=Object.assign({},config.settings,{receiptFooter:g('rf').value.trim()});saveConfig()};
  g('mksave').onclick=()=>{const v=g('mk').value.trim();if(v&&!/^AIza[\w-]{20,}$/.test(v)){toast('That doesn\'t look like a Google API key');return}LS.set('mapsKey',v);toast(v?'Key saved — reopen the app to load the map':'Key removed');renderSet()};
  if(g('inst'))g('inst').onclick=()=>{deferredPrompt.prompt();deferredPrompt=null;renderSet()};
  if(g('wtour'))g('wtour').onclick=()=>{wStep=0;showWelcome()};
  g('reset').onclick=()=>{if(outbox.length&&!confirmReset){confirmReset=true;g('reset').textContent=`Tap again — ${outbox.length} not uploaded will be lost`;return}
    recs={};outbox=[];serverLog=[];LS.set('log',[]);persist();confirmReset=false;toast('Phone reset');syncNow(true);renderSet()};
}


// ===================== welcome tour =====================
const WELCOME=[
  {i:'box',t:'Welcome to IV-X Field',b:'Your tool for getting IV-X on shelves across NYC. Every store on the route, every visit and every sale lives here, shared live with the whole team.'},
  {i:'pin',t:'Follow your route',b:'Pick the day at the top. Stores are listed in driving order. Tap <b>Open in Google Maps</b> to get directions through your next four stops, or <b>Navigate</b> and <b>Call</b> on any store.'},
  {i:'check',t:'Check in at every store',b:'Tap a store and choose <b>Sold</b>, <b>No sale</b>, <b>Follow up</b> or <b>Closed</b>. Add the order by flavor, shelf photos, samples left, the owner\'s contact and a signature if needed.'},
  {i:'repeat',t:'Never miss a follow-up',b:'<b>Follow-ups</b> lists every store due for a revisit or reorder check. <b>Pitch</b> has prices, store margins and answers to common objections.'},
  {i:'chart',t:'Works anywhere',b:'No signal? Keep going. Check-ins save on your phone and upload automatically. See totals on <b>Results</b>, and add the app to your home screen for one-tap access.'}];
let wStep=0;
function showWelcome(){
  let el=$('#welcome');if(!el){el=document.createElement('div');el.id='welcome';document.body.appendChild(el)}
  const s=WELCOME[wStep],last=wStep===WELCOME.length-1;
  el.className='welcome on';
  el.innerHTML=`<div class="wbox"><button class="wskip" id="wskip">${last?'':'Skip'}</button>
   <div class="wicon">${I(s.i)}</div><div class="wstep">${wStep+1} of ${WELCOME.length}</div><h2>${s.t}</h2><p>${s.b}</p>
   <div class="wdots">${WELCOME.map((_,i)=>`<span class="${i===wStep?'on':''}"></span>`).join('')}</div>
   <div class="wbtns">${wStep?'<button class="wback" id="wback">Back</button>':''}<button class="wnext" id="wnext">${last?'Get started':'Next'}</button></div></div>`;
  const done=()=>{LS.set('welcomed',true);el.classList.remove('on');wStep=0};
  $('#wnext').onclick=()=>{if(last)done();else{wStep++;showWelcome()}};
  if($('#wback'))$('#wback').onclick=()=>{wStep--;showWelcome()};
  $('#wskip').onclick=done;
}

// ===================== misc =====================
function confirm2(btn,txt){if(btn.dataset.armed)return true;btn.dataset.armed='1';btn.textContent=txt;return false}
function copy(t,msg){const ok=()=>toast(msg);const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Copy not allowed')}a.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}

// ===================== gyms & studios (kept separate from retail) =====================
const GYM_AREAS=[['all','All'],['astoria','Astoria · LIC'],['sunny','Sunnyside'],['ues','Upper East'],['mid','Midtown W'],['flat','Flatiron'],['down','Downtown']];
const GYM_AREA_NAME=Object.fromEntries(GYM_AREAS);
GYMS.forEach(g=>{g.id='gym_'+slug(g.name);g.kind='gym';g.day='gym';g.storeKey='gym_'+storeKeyOf(g.name,g.addr)});
let gymArea=LS.get('gymArea','all'),gymFilter=LS.get('gymFilter','todo');
function gymStats(list){const c={sold:0,no:0,fu:0,skip:0,todo:0,cases:0,orders:0};list.forEach(g=>{const v=live(g.id);if(!v||!v.status)c.todo++;else{c[v.status]++;c.cases+=+v.cases||0;c.orders+=parseFloat(v.orderTotal)||0}});c.total=list.length;c.done=c.total-c.todo;return c}
function gymDue(){const t=ymd();return GYMS.filter(g=>{const v=live(g.id);return v&&v.followUpDate&&v.followUpDate<=t&&v.status!=='sold'}).length}
function renderGyms(){
  const inArea=GYMS.filter(g=>gymArea==='all'||g.area===gymArea);
  const list=inArea.filter(g=>{const v=live(g.id);const done=v&&v.status;return gymFilter==='all'||(gymFilter==='todo'?!done:!!done)});
  const c=gymStats(inArea);
  let o=`<div class="ghead"><h2>Gyms &amp; Studios</h2><div class="m">Separate from your retail routes. Close to the stores you're already hitting.</div></div>
  <div class="prog"><div class="pbar"><span style="width:${c.total?(c.done/c.total*100).toFixed(0):0}%;background:#111"></span></div><div class="pnums"><div><b>${c.done}/${c.total}</b>visited</div><div><b style="color:var(--sold)">${c.sold}</b>sold</div><div><b>${c.cases}</b>cases</div><div><b style="color:var(--fu)">${c.fu}</b>follow up</div></div></div>
  <div class="gareas">${GYM_AREAS.map(([k,n])=>`<button data-ga="${k}" class="${gymArea===k?'on':''}">${n}<small>${k==='all'?GYMS.length:GYMS.filter(g=>g.area===k).length}</small></button>`).join('')}</div>
  <div class="ctrl"><div class="seg" id="gseg">${['todo','done','all'].map(f=>`<button data-gf="${f}" class="${gymFilter===f?'on':''}">${f==='todo'?'To do':f==='done'?'Done':'All'}</button>`).join('')}</div></div>
  <details class="gpitch"><summary>${I('message')} Gym pitch</summary><ul>
   <li><b>Sister company of Iron Vault</b> — we run a gym too, built for members like theirs.</li>
   <li><b>Pre-workout:</b> ENERGY.150 — 150mg caffeine from green tea, 215mg electrolytes, B vitamins.</li>
   <li><b>Recovery:</b> ENDURE.730 — 730mg electrolytes, caffeine-free. Good for after class.</li>
   <li>0g added sugar · 15 calories · non-carbonated · no sucralose.</li>
   <li>Front-desk fridge: $26/case of 12 = $2.17/can. Trusted by 100K+ athletes and 40+ run clubs.</li>
   <li>Ask for the owner or GM; offer a free case for the front desk to sample with members.</li></ul></details>`;
  const todoArea=inArea.filter(g=>!(live(g.id)||{}).status);
  if(gymArea!=='all'&&todoArea.length)o+=`<a class="gleg" href="${legLink(todoArea.slice(0,4),'gym')}" target="_blank" rel="noopener">${I('nav')} Drive the next ${Math.min(4,todoArea.length)} in ${GYM_AREA_NAME[gymArea]}</a>`;
  if(!list.length)o+=`<div class="empty">${gymFilter==='todo'?'Every gym here is checked off.':'Nothing checked off yet.'}</div>`;
  let lastArea='';
  list.forEach(g=>{const v=live(g.id);
    if(gymArea==='all'&&g.area!==lastArea){lastArea=g.area;o+=`<div class="garea">${GYM_AREA_NAME[g.area]}</div>`}
    const ph=(g.contact||'').match(/\d{3}-?\d{3}-?\d{4}/);const nd=DAYS.find(d=>d.k===g.near);
    o+=`<div class="st gym" data-gid="${esc(g.id)}"><div class="num" style="${v&&v.status?`background:${SC[v.status]};color:#fff;border:0;border-radius:50%`:'background:#111;color:#fff'}">${v&&v.status?icon(v.status):I('users')}</div>
     <div><h3>${esc(g.name)}</h3><div class="addr">${esc(g.addr.replace(/, (New York|Long Island City|Astoria|Sunnyside|Woodside), NY$/,''))}${g.contact?' · '+esc(g.contact):''}</div>
     <div class="chips"><span class="chip c-gym">${esc(g.type.toUpperCase())}</span>${nd?`<span class="chip" style="background:${HEX[nd.k]}1a;color:${HEX[nd.k]}">NEAR ${nd.d.toUpperCase()} ROUTE</span>`:''}${shopChip(v)}${portalChip(g.storeKey)}${v&&v.followUpDate&&v.status!=='sold'?`<span class="chip c-walk">${I('calendar')} ${esc(v.followUpDate.slice(5))}</span>`:''}</div>
     ${v&&v.status?resLine(v):''}
     <div class="acts"><a href="${navLink(g,'gym')}" target="_blank" rel="noopener">Navigate</a>${ph?`<a href="tel:${ph[0].replace(/-/g,'')}">Call</a>`:''}<a href="#" data-gopen>${v&&v.status?'Edit':'Check in'}</a></div></div></div>`});
  $('#v-gym').innerHTML=o;
  $('#v-gym').querySelectorAll('[data-ga]').forEach(b=>b.onclick=()=>{gymArea=b.dataset.ga;LS.set('gymArea',gymArea);renderGyms()});
  $('#v-gym').querySelectorAll('[data-gf]').forEach(b=>b.onclick=()=>{gymFilter=b.dataset.gf;LS.set('gymFilter',gymFilter);renderGyms()});
  $('#v-gym').querySelectorAll('[data-gopen]').forEach(a=>a.onclick=e=>{e.preventDefault();const id=a.closest('[data-gid]').dataset.gid;const g=GYMS.find(x=>x.id===id);if(g)openSheet({...g})});
}

function switchTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  ['route','gym','due','pitch','sum','set'].forEach(k=>$('#v-'+k).hidden=t!==k);render();window.scrollTo(0,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.t));
$('#gear').onclick=()=>switchTab('set');
$('#seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;$('#seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderRoute()});
$('#mapt').onclick=()=>{mapOn=!mapOn;$('#mapbox').classList.toggle('on',mapOn);$('#mapt').textContent=mapOn?'Hide map':'Map';renderRoute()};
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=$('#install');b.innerHTML=I('download')+' Add IV-X Field to your home screen — <b id="ib">Install</b>';b.classList.add('on');$('#ib').onclick=()=>{deferredPrompt.prompt();deferredPrompt=null;b.classList.remove('on')}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();boot();if(!LS.get('welcomed',false))showWelcome();

</script>
</body>
